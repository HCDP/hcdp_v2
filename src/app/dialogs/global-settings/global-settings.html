<h2 mat-dialog-title>Global Settings</h2>
<mat-dialog-content>
  <div class="options">
    <section>
      <div class="property-info">
        <span class="property-label">Preferred Units</span>
        <span class="property-desc">The default unit system to display data in.</span>
      </div>
      <!-- Replaced toggle group with chip listbox -->
      <mat-chip-listbox aria-label="Unit type">
        
        <mat-chip-option 
          value="metric"
          [selected]="preferredUnit() === 'metric'"
          (selectionChange)="$event.selected ? preferredUnit.set('metric') : (preferredUnit() === 'metric' ? $event.source.select() : null)">
          Metric
        </mat-chip-option>
        
        <mat-chip-option 
          value="usc"
          [selected]="preferredUnit() === 'usc'"
          (selectionChange)="$event.selected ? preferredUnit.set('usc') : (preferredUnit() === 'usc' ? $event.source.select() : null)">
          US Customary
        </mat-chip-option>

      </mat-chip-listbox>
    </section>
    <section>
      <div class="property-info">
        <span class="property-label">Email Adress</span>
        <span class="property-desc">The default email for export features.</span>
      </div>
      <mat-form-field>
        <mat-label>Email Address</mat-label>
        <input matInput [formControl]="emailControl" type="email" placeholder="user@hawaii.edu">
        
        @if(emailControl.hasError("email")) {
          <mat-error>Invalid email address. This value will not be saved</mat-error>
        }
      </mat-form-field>
    </section>
  </div>
</mat-dialog-content>
<mat-dialog-actions>
  <button mat-button aria-label="Save settings" (click)="close()">Cancel</button>
  <button mat-flat-button color="primary" aria-label="Cancel and close" (click)="saveSettings()">Save</button>
</mat-dialog-actions>
