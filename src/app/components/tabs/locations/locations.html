
  @if(stationData(); as stationResource) {
  @if(stationResource.isLoading()) {
    <mat-spinner></mat-spinner>
  }
  @if(stationResource.value(); as stations) {
    <div class="container">
      <app-location-selector
        (selectedLocation)="selectMapLocation($event)">
      </app-location-selector>
      <app-station-filters
        [manager]="stations">
      </app-station-filters>

      <div class="table-buffer">
        <h3>
          Stations
        </h3>
        <app-station-table 
          [manager]="stations"
          [(selectedStation)]="selectedStation">
        </app-station-table>
      </div>

      @let locationData = locationManager().location();
      @if(locationData && locationData.type === "station") {
        <div class="details-buffer">
          <app-station-details
            [station]="locationData.location">
          </app-station-details>
        </div>
      }
    </div>
  }
}
